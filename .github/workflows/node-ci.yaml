name: Multiple Runners Workflow and Choose Jobs
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Select the runner to execute the workflow'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      job-name:
          description: 'Select the job to execute'
          required: true
          default: 'job1'
          type: choice
          options:
            - build-job
            - test-job
            - deploy-job
jobs:
  build-job:
    if: contains(github.event.inputs.job-name, 'build-job')
    runs-on: ${{ github.event.inputs.runner }}
    steps:
      - name: Build Project
        run: echo "Building the project on ${{ github.event.inputs.runner }}"
  
  test-job:
    if: contains(github.event.inputs.job-name, 'test-job')
    runs-on: ${{ github.event.inputs.runner }}
    steps:  
      - name: Run Tests
        run: echo "Running tests on ${{ github.event.inputs.runner }}"
  deploy-job:
    if: contains(github.event.inputs.job-name, 'deploy-job')
    runs-on: ${{ github.event.inputs.runner }}
    steps:
      - name: Deploy Project
        run: echo "Deploying the project on ${{ github.event.inputs.runner }}"
    
